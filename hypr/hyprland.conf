# Set programs that you use
$terminal     = kitty
$fileManager  = nautilus -w
$menu         = anyrun
$browser      = thorium-browser

# ------------------------------------------------------------------------------
exec-once = dunst       # Notifications
exec-once = hyprpaper   # Wallpaper
exec-once = waybar      # Bar
exec-once = hypridle    # Idle manager

# Load plugins
exec-once = sleep 1 && hyprpm reload

# Cursor theme
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

exec-once = $HOME/.config/hypr/scripts/playerctl-inhibit.sh

# Polkit agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Screenshare fix
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# syshud
exec-once = syshud

# jellyfin mpv shim
exec-once = jellyfin-mpv-shim

exec-once = anyrun daemon
# ------------------------------------------------------------------------------


input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options = caps:hyper
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.78
        clickfinger_behavior = true
    }

    sensitivity = 0.0
    accel_profile = adaptive
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgb(e57e80)
    col.inactive_border = rgb(829181)
    layout = dwindle

    allow_tearing = true

    snap {
      enabled = true
      window_gap = 10
      monitor_gap = 10
      respect_gaps = true
    }
}

decoration {
    rounding = 5

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.1
        xray = false
        special = false
        brightness = 1.02
        popups = false
        ignore_opacity = true
    }

    shadow {
      enabled = true
      range = 60
      color = rgba(0000004A)
      offset = 0 15
      scale = 0.985
    }
    dim_special = 0.3
    active_opacity = 0.95
    inactive_opacity = 0.8
}
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.00

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 2, default
    animation = fade, 1, 2, default
    animation = fadeSwitch, 1, 9, default
    animation = fadeLayers, 1, 2, default
    animation = workspaces, 1, 2, default, slidefade 50%
    animation = specialWorkspace, 1, 2, default, slidefadevert -20%
}

dwindle {
    preserve_split = yes
    smart_resizing = yes
}

group {
    auto_group = false
    drag_into_group = 2
    col.border_active = rgb(81A092)
    col.border_inactive = rgb(4B8384)
    col.border_locked_active = rgb(86B376)
    col.border_locked_inactive = rgb(699968)

    groupbar {
      font_size = 11
      height = 20
      col.active = rgb(4B8384)
      col.inactive = rgb(4B8384)
    }
}

gestures {
    workspace_swipe_distance = 300
}

gesture = 3, horizontal, workspace

misc {
    # Set default hyprland wallpaper (not the one set by hyprpaper)
    font_family = Maple Mono NF
    force_default_wallpaper = 0
}

binds {
    workspace_center_on = 1
}

plugin {
    overview {
        panelColor = rgb(272e33)
        workspaceActiveBorder = rgb(d3c6aa)
        panelHeight = 160
        disableBlur = true
        reservedArea = 0
        hideBackgroundLayers = true
        hideTopLayers = true
        hideRealLayers = true
        affectStrut = true
        drawActiveWorkspace = true
        showSpecialWorkspace = false
        exitOnClick = true
        overrideGaps = true
        gapsIn = 16
        gapsOut = 32
    }
}

# Special workspace ============================================================
workspace = special:scratchpad, gapsin:20, gapsout:40
# ==============================================================================

# Window rules =================================================================

# Dialogs ----------------------------------------------------------------------
windowrule {
    name = dialogs
    match:modal = true
    float = true
    center = true
}
# ------------------------------------------------------------------------------

# Picture-in-Picture -----------------------------------------------------------
windowrule {
    name = picture-in-picture
    match:title = ^(Picture(-| )in(-| )[Pp]icture)$

    keep_aspect_ratio = true
    move = 73% 72%
    size = 25%
    float = true
    pin = true
}

# ------------------------------------------------------------------------------

# Idle inhibit for fullscreen firefox (for video playback)


# Games ------------------------------------------------------------------------
windowrule {
    name = game
    match:content = game
    monitor = 0
    # immediate = true
}

windowrule {
    name = game
    match:class = (steam_app)
    monitor = 0
    immediate = true
}

windowrule {
    name = game
    match:class = ([Mm]inecraft)
    monitor = 0
    immediate = true
}

# Fullscreen border
windowrule {
    name = fullscreen
    match:fullscreen_state_client = 1
    border_color = rgb(7fbbb3)
}

windowrule {
    name = kitty
    match:class = ^(kitty)$
    opacity = 0.9 0.8
}

windowrule {
    name = browser
    match:class = ^(thorium-browser)$
    opacity = 1
}

windowrule {
    name = browser-popup
    match:class = ^(thorium-.*-Profile_.*)$
    float = true
    move = cursor_x-window_w*0.5 cursor_y-window_h*0.5
}

windowrule {
    name = pavucontrol
    match:class = ^(org.pulseaudio.pavucontrol)$
    float = true
    center = true
}


# Workspce presets -------------------------------------------------------------
windowrule {
    name = steam
    match:class = ^(steam)$
    workspace = 5
}

exec-once = [workspace 2 silent] discord
windowrule {
    name = discord
    match:class = ^(discord)$
    workspace = 2
}

# ==============================================================================

# Layer rules ==================================================================
layerrule {
    name = anyrun
    match:namespace = ^(anyrun)$
    dim_around = on
}
# ==============================================================================

source = ./binds.conf
source = ./hw.conf      # Hardware configuration
